name: j3dai-sharing

services:
  vscode:
    build:
      context: .
      dockerfile: ./.devcontainer/vscode/Containerfile
    command: /bin/sh -c "while sleep 1000; do :; done"
    container_name: ${COMPOSE_PROJECT_NAME}-vscode
    environment:
      TASK_TEMP_DIR: '~/.task'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/workspace:cached
      - source: ~/.ssh
        target: /root/.ssh
        type: bind
      - source: ~/.npmrc
        target: /root/.npmrc
        type: bind
      - source: ~/.kube
        target: /root/.kube
        type: bind
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind

volumes:
  node-modules:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
